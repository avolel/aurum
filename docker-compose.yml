name: aurum

services:
  # timescaledb-ha bundles both TimescaleDB and pgvector (D-3 in ops/decisions/decisions.md),
  # so Phase 2's pgvector needs no custom image.
  # ops/db/init/ runs once on an empty data volume and fails loudly if the
  # image does not ship the extensions the app depends on.
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: aurum-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - aurum-postgres-data:/home/postgres/pgdata/data
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ollama:
    image: ollama/ollama:0.40.9
    container_name: aurum-ollama
    restart: "no"
    volumes:
      - aurum-ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      # ollama's image has no curl; its own CLI is the reliable probe.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: src/Aurum.Api/Dockerfile
    environment:
      # Production unless .env asks for Development, so a deployed container can't start with
      # Swagger and the developer error page switched on by accident.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__Aurum:?set in .env}
      Ollama__BaseUrl: ${Ollama__BaseUrl:-http://ollama:11434}
      PriceSources__GoldApiIo__ApiKey: ${PriceSources__GoldApiIo__ApiKey:-}
      PriceSources__ApiNinjas__ApiKey: ${PriceSources__ApiNinjas__ApiKey:-}
      PriceSources__MetalpriceApi__ApiKey: ${PriceSources__MetalpriceApi__ApiKey:-}
      Macro__Fred__ApiKey: ${Macro__Fred__ApiKey:-}
      Macro__Bls__ApiKey: ${Macro__Bls__ApiKey:-}
      PriceSources__GoldApiIo__MonthlyRequestLimit: ${PriceSources__GoldApiIo__MonthlyRequestLimit:-100}
      # Compose forwards only the variables listed here, so a switch in .env does nothing without
      # its line. These are how the fallback check switches off the primary.
      PriceSources__GoldApiIo__Enabled: ${PriceSources__GoldApiIo__Enabled:-true}
      PriceSources__ApiNinjas__Enabled: ${PriceSources__ApiNinjas__Enabled:-true}
      PriceSources__MetalpriceApi__Enabled: ${PriceSources__MetalpriceApi__Enabled:-true}
      PricePolling__PollInterval: ${PricePolling__PollInterval:-00:15:00}
      PriceFeed__Resilience__MaxAttempts: ${PriceFeed__Resilience__MaxAttempts:-3}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  aurum-postgres-data:
    external: true
    name: aurum_aurum-postgres-data
  aurum-ollama-models:
    external: true
    name: aurum_aurum-ollama-models
