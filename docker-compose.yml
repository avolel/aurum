name: aurum

services:
  # timescaledb-ha bundles both TimescaleDB and pgvector. D-3 in the phase plan:
  # picking it now avoids building a custom image when Phase 2 needs pgvector.
  # ops/db/init/ runs once on an empty data volume and will fail loudly if the
  # image does not actually ship the extensions we depend on.
  postgres:
    image: timescale/timescaledb-ha:pg17
    container_name: aurum-postgres
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - aurum-postgres-data:/home/postgres/pgdata/data
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurum}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: aurum-ollama
    restart: "no"
    volumes:
      # Named volume so `docker compose down -v` does not nuke tens of GB of
      # model weights. Remove it explicitly if you really mean to.
      - aurum-ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      # ollama's image has no curl; its own CLI is the reliable probe.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: src/Aurum.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Aurum: ${ConnectionStrings__Aurum:?set in .env}
      Ollama__BaseUrl: ${Ollama__BaseUrl:-http://ollama:11434}
      PriceSources__GoldApiIo__ApiKey: ${PriceSources__GoldApiIo__ApiKey:-}
      PriceSources__ApiNinjas__ApiKey: ${PriceSources__ApiNinjas__ApiKey:-}
      PriceSources__MetalpriceApi__ApiKey: ${PriceSources__MetalpriceApi__ApiKey:-}
      PriceSources__GoldApiIo__MonthlyRequestLimit: ${PriceSources__GoldApiIo__MonthlyRequestLimit:-100}
      PricePolling__PollInterval: ${PricePolling__PollInterval:-00:05:00}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  aurum-postgres-data:
  aurum-ollama-models:
